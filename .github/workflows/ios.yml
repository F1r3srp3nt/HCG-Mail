# HCG Mail for iPhone and iPad — validation only.
# Builds and tests; never signs with a distribution identity, never uploads to TestFlight or the App Store,
# never contacts a real mailbox. Screenshots and logs are uploaded as workflow artifacts, not committed.
name: iOS

on:
  pull_request:
    paths:
      - 'iOS App Store Submission/**'
      - 'iOS Executable/**'
      - 'Windows-executable-Application/src/**'
      - 'Windows-executable-Application/tests/**'
      - 'Windows-executable-Application/Directory.*'
      - 'hcg-apps.json'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'iOS App Store Submission/**'
      - 'Windows-executable-Application/src/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  tests:
    name: Shared code and mobile UI tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'
      - name: Exactly one iOS application in the repository (hcg-apps.json and a project scan agree)
        run: python3 -I "iOS App Store Submission/scripts/verify-app-selection.py"
      - name: App Store Connect text (Apple's limits, no placeholders, nothing this build does not offer)
        run: python3 -I "iOS App Store Submission/scripts/check-store-metadata.py"
      - name: Build diagnostics (HCG001 for a lone iOS folder, HCG002 for the iOS app on Linux)
        run: |
          set +e
          dotnet build "iOS App Store Submission/src/HCG.Mail.iOS/HCG.Mail.iOS.csproj" > "$RUNNER_TEMP/ios-on-linux.log" 2>&1
          grep -q "error HCG002" "$RUNNER_TEMP/ios-on-linux.log" || { cat "$RUNNER_TEMP/ios-on-linux.log"; exit 1; }
          lone="$RUNNER_TEMP/lone"; mkdir -p "$lone"; cp -r "iOS App Store Submission" "$lone/"
          dotnet build "$lone/iOS App Store Submission/src/HCG.Mail.Mobile/HCG.Mail.Mobile.csproj" > "$RUNNER_TEMP/lone.log" 2>&1
          grep -q "error HCG001" "$RUNNER_TEMP/lone.log" || { cat "$RUNNER_TEMP/lone.log"; exit 1; }
          dotnet build "$lone/iOS App Store Submission/src/HCG.Mail.Mobile/HCG.Mail.Mobile.csproj" -p:HcgSharedRoot="$PWD/Windows-executable-Application" || exit 1
          echo "HCG001/HCG002 reported as expected; HcgSharedRoot override builds."
      - name: Desktop and shared tests (the iOS app reuses this code)
        working-directory: Windows-executable-Application
        run: dotnet test HCG.Mail.sln -c Release
      - name: Mobile UI tests (iPhone and iPad layouts, flows, rendering — headless)
        working-directory: iOS App Store Submission
        env:
          HCG_MAIL_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/headless-screenshots
        run: dotnet test tests/HCG.Mail.Mobile.Tests -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-screenshots
          path: artifacts/headless-screenshots
          if-no-files-found: ignore
          retention-days: 14

  simulator:
    name: iOS build, simulator self-test and screenshots (macOS)
    # GitHub's xcode-27 image (macOS 27, arm64) has Xcode 27.2 at /Applications/Xcode_27.2.app and iOS 27.2 simulators
    # (its default Xcode is 27.1, so the step below selects the pinned one). The macos-26 image has no Xcode 27.
    runs-on: xcode-27
    # Hosted runners sometimes take 20+ minutes for one cold simulator boot (and once 51 minutes for the screenshot
    # step), so the job needs room beyond the steps' own limits.
    timeout-minutes: 150
    defaults:
      run:
        # bash -eo pipefail: a failing script must fail the step even when piped into tee.
        shell: bash
        working-directory: iOS App Store Submission
    steps:
      - uses: actions/checkout@v4
      - name: Select the Xcode version pinned in toolchain.props
        run: |
          XCODE_VERSION="$(sed -n 's:.*<HcgRequiredXcode>\(.*\)</HcgRequiredXcode>.*:\1:p' toolchain.props)"
          echo "Installed:"; ls -d /Applications/Xcode* || true
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then echo "Xcode ${XCODE_VERSION} is not installed on this runner."; exit 1; fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'
      - name: Install the pinned iOS workload
        run: scripts/install-workload.sh
      - name: Build doctor (sources, host, SDK, workload, Xcode, deployment, signing)
        run: scripts/doctor.sh
      - name: Build for the simulator (Debug)
        run: scripts/build-simulator.sh Debug | tee "$RUNNER_TEMP/app-path.txt"
      # Through Xcode before the simulator steps below: xcodebuild enumerates simulator devices and is much slower once
      # they have been booted and used.
      - name: Xcode project opens from a fresh checkout (targets and shared schemes)
        timeout-minutes: 10
        run: xcodebuild -list -project HCGMail.xcodeproj
      - name: Xcode scheme "HCG Mail" builds the app for the simulator
        timeout-minutes: 20
        run: xcodebuild -project HCGMail.xcodeproj -scheme "HCG Mail" -sdk iphonesimulator -configuration Debug build
      - name: Check the simulator app (bundle ID, versions, icon, launch screen, privacy manifest)
        run: python3 -I scripts/verify-ios-build.py app ../artifacts/ios/simulator/Debug/HCGMail.iOS.app --kind simulator
      - name: Xcode scheme "HCG Mail Simulator" builds, installs and starts the app
        timeout-minutes: 35
        run: |
          start=$SECONDS
          xcodebuild -project HCGMail.xcodeproj -scheme "HCG Mail Simulator" -sdk iphonesimulator -configuration Debug build
          echo "xcodebuild returned after $((SECONDS - start)) s"
          # The scheme returns after the build and starts the app in the background; wait for its verdict. A cold
          # simulator boot on a hosted runner has taken up to ~20 minutes, so the limit is wall-clock time.
          log=../artifacts/ios/simulator/launch.log
          while (( SECONDS - start < 1800 )); do grep -q 'HCG-LAUNCH:' "$log" 2>/dev/null && break; sleep 5; done
          echo "launch finished after $((SECONDS - start)) s:"
          cat "$log"
          grep -q 'HCG-LAUNCH: started' "$log"
      - name: Self-test on an iPhone simulator (Keychain, sandbox, sanitizer, configuration)
        # --exclusive: Simulator.app, opened by the step above, boots its own default device ("iPhone 17") next to the
        # one the app runs on; run 45058813099 had both booted and a load average above 300.
        timeout-minutes: 40
        env:
          HCG_IOS_SIM_LOG_DIR: ${{ github.workspace }}/artifacts/ios-sim-logs
        run: |
          mkdir -p ../artifacts/ios-screenshots
          HCG_IOS_APP="$(tail -1 "$RUNNER_TEMP/app-path.txt")" scripts/run-simulator.sh --exclusive --self-test
      # Preview mode: sample mailbox, no network. Each device is its own step, and run-simulator.sh limits and logs
      # every stage (boot, install, launch, ready, screenshot), so a stall names its stage well before the step limit.
      # --exclusive shuts the iPhone down before the iPad boots: in run 44953152990 the iPad boot, started while the
      # iPhone, its app and Simulator.app were still running, made no progress for 58 minutes.
      - name: Screenshot in preview mode on iPhone (the app reports the inbox is open)
        timeout-minutes: 40
        env:
          HCG_IOS_SIM_LOG_DIR: ${{ github.workspace }}/artifacts/ios-sim-logs
        run: |
          # Simulator.app (opened by the Xcode launch step) is not needed for screenshots; its window rendering
          # competes with the capture on a loaded runner.
          osascript -e 'quit app "Simulator"' 2>/dev/null || killall Simulator 2>/dev/null || true
          HCG_IOS_APP="$(tail -1 "$RUNNER_TEMP/app-path.txt")" \
            scripts/run-simulator.sh --exclusive --preview --screen inbox --screenshot ../artifacts/ios-screenshots/iphone.png
      - name: Screenshot in preview mode on iPad (the app reports the inbox is open)
        timeout-minutes: 40
        env:
          HCG_IOS_SIM_LOG_DIR: ${{ github.workspace }}/artifacts/ios-sim-logs
        run: |
          HCG_IOS_APP="$(tail -1 "$RUNNER_TEMP/app-path.txt")" \
            scripts/run-simulator.sh --ipad --exclusive --preview --screen inbox --screenshot ../artifacts/ios-screenshots/ipad.png
      - name: The builds left the checkout clean
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - name: Shut down the simulators (leave nothing running for the runner's clean-up)
        if: always()
        timeout-minutes: 10
        run: |
          xcrun simctl shutdown all || true
          killall Simulator 2>/dev/null || true
          pkill -f 'scripts/run-simulator.sh' 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: |
            artifacts/ios-screenshots
            artifacts/ios-sim-logs
          if-no-files-found: ignore
          retention-days: 14

  simulator-release:
    name: Release build on the simulator (trimmed, AOT) — launch, start-up trace, self-test
    # The simulator job above runs the Debug build (interpreter). This one builds the shipped configuration (Release:
    # trimmed and AOT-compiled, here for the simulator) and starts it, so a trimming, AOT or Release-only start-up
    # failure shows without a phone. Its own job: the Release simulator build alone took over 36 minutes (run 45629298838).
    runs-on: xcode-27
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: iOS App Store Submission
    steps:
      - uses: actions/checkout@v4
      - name: Select the Xcode version pinned in toolchain.props
        run: |
          XCODE_VERSION="$(sed -n 's:.*<HcgRequiredXcode>\(.*\)</HcgRequiredXcode>.*:\1:p' toolchain.props)"
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then echo "Xcode ${XCODE_VERSION} is not installed on this runner."; exit 1; fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'
      - name: Install the pinned iOS workload
        run: scripts/install-workload.sh
      - name: Build for the simulator (Release)
        timeout-minutes: 120
        run: scripts/build-simulator.sh Release | tee "$RUNNER_TEMP/app-path.txt"
      - name: Start the Release build on an iPhone simulator (start-up trace and self-test)
        timeout-minutes: 40
        env:
          HCG_IOS_SIM_LOG_DIR: ${{ github.workspace }}/artifacts/ios-sim-logs-release
        run: HCG_IOS_APP="$(tail -1 "$RUNNER_TEMP/app-path.txt")" HCG_IOS_CONFIGURATION=Release scripts/run-simulator.sh --exclusive --self-test
      - name: Shut down the simulators
        if: always()
        timeout-minutes: 10
        run: |
          xcrun simctl shutdown all || true
          killall Simulator 2>/dev/null || true
          pkill -f 'scripts/run-simulator.sh' 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-release-logs
          path: artifacts/ios-sim-logs-release
          if-no-files-found: ignore
          retention-days: 14
      - name: Keep the Release simulator app for the older-iOS job
        run: |
          app="$(tail -1 "$RUNNER_TEMP/app-path.txt")"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/HCGMail-simulator-release.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-release-app
          path: ${{ runner.temp }}/HCGMail-simulator-release.zip
          retention-days: 7

  older-ios:
    name: Release build on older iOS simulators (${{ matrix.label }})
    # The Release app above runs on iOS 27.2, which says nothing about the oldest iOS the app declares (16.0). This
    # starts the same .app on the oldest iOS runtime each source offers and reports how far the start-up trace got.
    # Which runtimes exist depends on the runner image, so each source is tried independently.
    needs: simulator-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          # Run 45656262522: the macos-15 image's oldest runtime is iOS 18.5; Xcode 27 cannot download iOS 16.4 or 17.5
          # ("not available for download"); the macos-14 image did not start. The macos-15 image's own Xcode is older,
          # so it is asked for the older runtimes.
          - { label: "macos-15 image, oldest preinstalled", runner: macos-15, download: "" }
          - { label: "macos-15 image + downloaded iOS 17.5", runner: macos-15, download: "17.5" }
          - { label: "macos-15 image + downloaded iOS 16.4", runner: macos-15, download: "16.4" }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios-simulator-release-app
          path: ${{ runner.temp }}/app
      - name: Runtime (download if requested)
        if: matrix.download != ''
        timeout-minutes: 60
        run: xcodebuild -downloadPlatform iOS -buildVersion "${{ matrix.download }}"
      - name: Start the app on the oldest iOS 16+ runtime and read its start-up trace
        timeout-minutes: 30
        shell: bash
        run: |
          set -u
          cd "$RUNNER_TEMP/app" && ditto -x -k HCGMail-simulator-release.zip . && APP="$PWD/$(ls -d *.app | head -1)"
          xcrun simctl list runtimes
          want="${{ matrix.download }}"
          rt="$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys; want=sys.argv[1]
          rts=[r for r in json.load(sys.stdin)["runtimes"] if r["platform"]=="iOS" and r.get("isAvailable")]
          rts=[r for r in rts if tuple(map(int,r["version"].split(".")[:2]))>=(16,0) and (not want or r["version"].startswith(want))]
          rts.sort(key=lambda r: tuple(map(int,r["version"].split("."))))
          print(rts[0]["identifier"]+" "+rts[0]["version"] if rts else "")' "$want")"
          [ -n "$rt" ] || { echo "No iOS 16.0+ simulator runtime${want:+ $want} on this runner."; exit 1; }
          id="${rt%% *}"; ver="${rt##* }"
          # An iPhone this runtime supports (the newest one it lists).
          dt="$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          r=[r for r in json.load(sys.stdin)["runtimes"] if r["identifier"]==sys.argv[1]][0]
          print([d["identifier"] for d in r.get("supportedDeviceTypes",[]) if d["name"].startswith("iPhone")][-1])' "$id")"
          udid="$(xcrun simctl create "HCG older iOS" "$dt" "$id")" || { echo "This runtime cannot create $dt"; exit 1; }
          echo "Simulator: iOS $ver, $dt"
          xcrun simctl boot "$udid"; xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$APP"
          log="$RUNNER_TEMP/app.log"
          SIMCTL_CHILD_HCG_MAIL_SELF_TEST=1 xcrun simctl launch --console-pty --terminate-running-process "$udid" com.hakmicapitalgroup.hcgmail > "$log" 2>&1 &
          for i in $(seq 1 240); do grep -q 'HCG-SELFTEST: \(PASS\|FAIL\)' "$log" && break; sleep 2; done
          kill %1 2>/dev/null || true
          echo "== iOS $ver: start-up trace and self-test"; grep -E 'HCG-STARTUP|HCG-SELFTEST' "$log" || { echo "(no output)"; tail -40 "$log"; }
          echo "== crash reports"; ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i hcg || echo "none"
          xcrun simctl shutdown "$udid" || true
          grep -q ' ms  first-frame' "$log" || { echo "iOS $ver: start-up did NOT reach the first frame"; exit 1; }
          echo "iOS $ver: start-up reached the first frame"

  device-aot:
    # The App Store build is fully AOT-compiled; this takes much longer than a simulator build, so it runs as its own
    # job in parallel, through the Xcode scheme. Unsigned: CI holds no certificates, so this proves the App Store
    # configuration compiles and is packaged correctly; signing and the archive are scripts/export-ipa.sh on the owner's Mac.
    name: Compile for devices (ios-arm64, Release, AOT, unsigned)
    runs-on: xcode-27   # Xcode 27.2, see the simulator job
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: iOS App Store Submission
    steps:
      - uses: actions/checkout@v4
      - name: Select the Xcode version pinned in toolchain.props
        run: |
          XCODE_VERSION="$(sed -n 's:.*<HcgRequiredXcode>\(.*\)</HcgRequiredXcode>.*:\1:p' toolchain.props)"
          echo "Installed:"; ls -d /Applications/Xcode* || true
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then echo "Xcode ${XCODE_VERSION} is not installed on this runner."; exit 1; fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'
      - name: Install the pinned iOS workload
        run: scripts/install-workload.sh
      - name: Xcode project opens from a fresh checkout (targets and shared schemes)
        timeout-minutes: 10
        run: xcodebuild -list -project HCGMail.xcodeproj
      - name: Xcode scheme "HCG Mail", Any iOS Device, Release (ios-arm64, AOT, unsigned)
        run: xcodebuild -project HCGMail.xcodeproj -scheme "HCG Mail" -sdk iphoneos -configuration Release build
      - name: Check the Release device app (bundle ID, versions, SDK, icon, launch screen, privacy manifest)
        run: |
          mkdir -p ../artifacts/ios-release-check
          app=../artifacts/ios/device/Release/HCGMail.iOS.app
          python3 -I scripts/verify-ios-build.py app "$app" --kind device | tee ../artifacts/ios-release-check/verification.txt
          plutil -convert xml1 -o ../artifacts/ios-release-check/Info.plist "$app/Info.plist"
          cp "$app/PrivacyInfo.xcprivacy" ../artifacts/ios-release-check/
          xcrun --sdk iphoneos assetutil --info "$app/Assets.car" > ../artifacts/ios-release-check/assets.json
      - name: Product › Archive from the scheme stops and points to scripts/export-ipa.sh
        run: |
          set +e
          xcodebuild -project HCGMail.xcodeproj -scheme "HCG Mail" -sdk iphoneos -configuration Release archive \
            -archivePath "$RUNNER_TEMP/scheme.xcarchive" > "$RUNNER_TEMP/archive.log" 2>&1
          rc=$?
          tail -25 "$RUNNER_TEMP/archive.log"
          if [ $rc -ne 0 ] && grep -q "Product › Archive is not supported" "$RUNNER_TEMP/archive.log"; then
            echo "Archive from the scheme is refused with directions, as documented."
          else
            echo "Unexpected: xcodebuild archive exited $rc without the documented message."; exit 1
          fi
      - name: The build left the checkout clean
        run: test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-release-check
          path: artifacts/ios-release-check
          if-no-files-found: ignore
          retention-days: 30

  store-screenshots:
    # Real screenshots of the app for App Store Connect, at the sizes it requires (6.9" iPhone, 13" iPad), from the
    # Debug build in preview mode: the labelled sample mailbox, no network, no account. Release pull requests only.
    name: App Store screenshots (iPhone 6.9", iPad 13")
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'release/')
    runs-on: xcode-27   # Xcode 27.2, see the simulator job
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: iOS App Store Submission
    steps:
      - uses: actions/checkout@v4
      - name: Select the Xcode version pinned in toolchain.props
        run: |
          XCODE_VERSION="$(sed -n 's:.*<HcgRequiredXcode>\(.*\)</HcgRequiredXcode>.*:\1:p' toolchain.props)"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'
      - name: Install the pinned iOS workload
        run: scripts/install-workload.sh
      - name: Build for the simulator (Debug)
        run: scripts/build-simulator.sh Debug | tee "$RUNNER_TEMP/app-path.txt"
      - name: Take screenshots (inbox, message, compose) on the newest iPhone Pro Max and iPad Pro 13-inch
        timeout-minutes: 120
        env:
          HCG_IOS_SIM_LOG_DIR: ${{ github.workspace }}/artifacts/ios-sim-logs
        run: |
          export HCG_IOS_APP="$(tail -1 "$RUNNER_TEMP/app-path.txt")"
          out=../artifacts/app-store-screenshots; mkdir -p "$out"
          # The 6.9" iPhone changes name with each simulator generation (iOS 27.2 has the iPhone 18 Pro Max); the size
          # check below still decides whether App Store Connect accepts the screenshots.
          iphone="$(xcrun simctl list devices available -j | python3 -I -c 'import json, re, sys
          d = json.load(sys.stdin)["devices"]
          names = {x["name"] for r in d if "iOS" in r for x in d[r] if re.fullmatch(r"iPhone \d+ Pro Max", x["name"])}
          print(max(names, key=lambda n: int(re.search(r"\d+", n).group())))')"
          echo "iPhone for 6.9-inch screenshots: $iphone"
          for device in "$iphone" "iPad Pro 13-inch (M5)"; do
            # Boots only this simulator (others shut down), with a time limit and diagnostics if it stalls.
            scripts/run-simulator.sh "$device" --exclusive --boot-only
            udid="$(xcrun simctl list devices available -j | DEVICE="$device" python3 -c 'import json,os,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for r in sorted(d, reverse=True) if "iOS" in r for x in d[r] if x["name"]==os.environ["DEVICE"]))')"
            # No first-run keyboard tip ("slide to type") over the composer.
            xcrun simctl spawn "$udid" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
            # Apple's standard clean status bar for store screenshots (9:41, full signal and battery).
            xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            name="$(echo "$device" | tr -cd '[:alnum:]')"
            for screen in inbox reader compose; do
              # Waits until the app reports the screen is open (HCG-PREVIEW: ready …); fails if it never is.
              scripts/run-simulator.sh "$device" --preview --screen "$screen" --screenshot "$out/$name-$screen.png"
            done
            xcrun simctl shutdown "$udid" || true
          done
          # App Store Connect accepts 1320×2868 / 1290×2796 (6.9") and 2064×2752 / 2048×2732 (13").
          python3 - "$out" <<'PY'
          import struct, sys, pathlib
          ok = {(1320, 2868), (1290, 2796), (2064, 2752), (2048, 2732)}
          bad = 0
          for p in sorted(pathlib.Path(sys.argv[1]).glob("*.png")):
              w, h = struct.unpack(">II", p.read_bytes()[16:24])
              good = (w, h) in ok
              bad += not good
              print(f"{'OK  ' if good else 'BAD '} {p.name} {w}x{h}")
          sys.exit(1 if bad else 0)
          PY
      - name: Shut down the simulators
        if: always()
        timeout-minutes: 10
        run: |
          xcrun simctl shutdown all || true
          pkill -f 'scripts/run-simulator.sh' 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-store-screenshot-logs
          path: artifacts/ios-sim-logs
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots
          path: artifacts/app-store-screenshots
          if-no-files-found: ignore
          retention-days: 90
