# HCG Mail for iPhone and iPad — validation only.
# Builds and tests; never signs with a distribution identity, never uploads to TestFlight or the App Store,
# never contacts a real mailbox. Screenshots and logs are uploaded as workflow artifacts, not committed.
name: iOS

on:
  pull_request:
    paths:
      - 'iOS App Store Submission/**'
      - 'iOS Executable/**'
      - 'Windows-executable-Application/src/**'
      - 'Windows-executable-Application/tests/**'
      - 'Windows-executable-Application/Directory.*'
      - 'hcg-apps.json'
      - '.github/workflows/ios.yml'
  push:
    branches: [main]
    paths:
      - 'iOS App Store Submission/**'
      - 'Windows-executable-Application/src/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  tests:
    name: Shared code and mobile UI tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'
      - name: Exactly one iOS application in the repository (hcg-apps.json and a project scan agree)
        run: python3 -I "iOS App Store Submission/scripts/verify-app-selection.py"
      - name: Build diagnostics (HCG001 for a lone iOS folder, HCG002 for the iOS app on Linux)
        run: |
          set +e
          dotnet build "iOS App Store Submission/src/HCG.Mail.iOS/HCG.Mail.iOS.csproj" > "$RUNNER_TEMP/ios-on-linux.log" 2>&1
          grep -q "error HCG002" "$RUNNER_TEMP/ios-on-linux.log" || { cat "$RUNNER_TEMP/ios-on-linux.log"; exit 1; }
          lone="$RUNNER_TEMP/lone"; mkdir -p "$lone"; cp -r "iOS App Store Submission" "$lone/"
          dotnet build "$lone/iOS App Store Submission/src/HCG.Mail.Mobile/HCG.Mail.Mobile.csproj" > "$RUNNER_TEMP/lone.log" 2>&1
          grep -q "error HCG001" "$RUNNER_TEMP/lone.log" || { cat "$RUNNER_TEMP/lone.log"; exit 1; }
          dotnet build "$lone/iOS App Store Submission/src/HCG.Mail.Mobile/HCG.Mail.Mobile.csproj" -p:HcgSharedRoot="$PWD/Windows-executable-Application" || exit 1
          echo "HCG001/HCG002 reported as expected; HcgSharedRoot override builds."
      - name: Desktop and shared tests (the iOS app reuses this code)
        working-directory: Windows-executable-Application
        run: dotnet test HCG.Mail.sln -c Release
      - name: Mobile UI tests (iPhone and iPad layouts, flows, rendering — headless)
        working-directory: iOS App Store Submission
        env:
          HCG_MAIL_SCREENSHOT_DIR: ${{ github.workspace }}/artifacts/headless-screenshots
        run: dotnet test tests/HCG.Mail.Mobile.Tests -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-screenshots
          path: artifacts/headless-screenshots
          if-no-files-found: ignore
          retention-days: 14

  simulator:
    name: iOS build, simulator self-test and screenshots (macOS)
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        # bash -eo pipefail: a failing script must fail the step even when piped into tee.
        shell: bash
        working-directory: iOS App Store Submission
    steps:
      - uses: actions/checkout@v4
      - name: Select the Xcode version pinned in toolchain.props
        run: |
          XCODE_VERSION="$(sed -n 's:.*<HcgRequiredXcode>\(.*\)</HcgRequiredXcode>.*:\1:p' toolchain.props)"
          echo "Installed:"; ls -d /Applications/Xcode* || true
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then echo "Xcode ${XCODE_VERSION} is not installed on this runner."; exit 1; fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'
      - name: Install the pinned iOS workload
        run: scripts/install-workload.sh
      - name: Build doctor (sources, host, SDK, workload, Xcode, deployment, signing)
        run: scripts/doctor.sh
      - name: Build for the simulator (Debug)
        run: scripts/build-simulator.sh Debug | tee "$RUNNER_TEMP/app-path.txt"
      - name: Self-test on an iPhone simulator (Keychain, sandbox, sanitizer, configuration)
        run: |
          mkdir -p ../artifacts/ios-screenshots
          HCG_IOS_APP="$(tail -1 "$RUNNER_TEMP/app-path.txt")" scripts/run-simulator.sh --self-test
      - name: Screenshots in preview mode (sample mailbox, no network)
        run: |
          export HCG_IOS_APP="$(tail -1 "$RUNNER_TEMP/app-path.txt")"
          scripts/run-simulator.sh --preview --screenshot ../artifacts/ios-screenshots/iphone.png
          scripts/run-simulator.sh --ipad --preview --screenshot ../artifacts/ios-screenshots/ipad.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: artifacts/ios-screenshots
          if-no-files-found: ignore
          retention-days: 14

  device-aot:
    # The App Store build is fully AOT-compiled; this takes much longer than a simulator build, so it runs as its own
    # job in parallel. Unsigned: CI holds no certificates, so this proves the code compiles for devices, nothing more.
    name: Compile for devices (ios-arm64, Release, AOT, unsigned)
    runs-on: macos-26
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
        working-directory: iOS App Store Submission
    steps:
      - uses: actions/checkout@v4
      - name: Select the Xcode version pinned in toolchain.props
        run: |
          XCODE_VERSION="$(sed -n 's:.*<HcgRequiredXcode>\(.*\)</HcgRequiredXcode>.*:\1:p' toolchain.props)"
          echo "Installed:"; ls -d /Applications/Xcode* || true
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then echo "Xcode ${XCODE_VERSION} is not installed on this runner."; exit 1; fi
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.1xx'
      - name: Install the pinned iOS workload
        run: scripts/install-workload.sh
      - name: Release build for ios-arm64 (AOT), without code signing
        run: dotnet build src/HCG.Mail.iOS/HCG.Mail.iOS.csproj -c Release -f net10.0-ios -r ios-arm64 -p:EnableCodeSigning=false
