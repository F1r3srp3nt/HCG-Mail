# Publishes the Windows build of HCG Mail as a GitHub release.
# Runs only when a version tag (v*) is pushed, or when started by hand (Actions → Release Windows build →
# Run workflow) with a version such as v0.1.0-mvp. Either way, releasing is the founder's decision.
# Builds Windows only; other platforms are produced separately with HCG Executable Maker.
name: Release Windows build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release version tag to create, e.g. v0.1.0-mvp"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Windows-executable-Application
    steps:
      - uses: actions/checkout@v5

      - name: Check release tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$TAG' must look like v1.2.3 or v1.2.3-label" >&2
            exit 1
          fi

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Run tests
        run: dotnet test HCG.Mail.sln -c Release

      - name: Build HCGMail.exe (win-x64, self-contained)
        run: bash scripts/publish-windows.sh

      - name: Checksums
        run: |
          cd artifacts
          sha256sum HCGMail-*-win-x64.zip publish/win-x64/HCGMail.exe | sed 's#publish/win-x64/##' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          {
            echo "Windows x64 build of HCG Mail ${TAG}, built by GitHub Actions from commit ${GITHUB_SHA}."
            echo
            echo "Download HCGMail-*-win-x64.zip, unzip and run HCGMail.exe (no .NET installation needed)."
            echo "The build is not code-signed: Windows SmartScreen shows \"Windows protected your PC\" → More info → Run anyway."
            echo
            echo "SHA-256:"
            echo '```'
            cat artifacts/SHA256SUMS.txt
            echo '```'
          } > release-notes.md
          gh release create "$TAG" artifacts/HCGMail-*-win-x64.zip artifacts/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "HCG Mail ${TAG} (Windows)" --notes-file release-notes.md --prerelease
